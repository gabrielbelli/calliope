<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
  <!-- The Calliope mark, monochrome, for the OpenClip menu: the swell and the
       lamp out of shared/mark.swift, with the dark plate dropped and the ink
       refitted to a 24 box. currentColor because OpenClip tints its action
       icons, the way the other extensions here do.

       NO DOUBLE HYPHEN ANYWHERE IN THIS NOTE. XML forbids two hyphens inside a
       comment, and an earlier version of this note used them as a dash: macOS's
       SVG loader, the one OpenClip draws its icons with, then refused the whole
       file (measured: NSImage(data:) returned nil), so Speak had no icon. -->
  <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        d="M3 14.1C7.1 14.1 8.2 18.6 12 18.6C15.8 18.6 17 14.1 21 14.1"/>
  <circle cx="12" cy="7.8" r="3.4" fill="currentColor"/>
</svg>
