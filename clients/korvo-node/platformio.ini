; Calliope node firmware, ESP32-Korvo v1.1 (ESP32-WROVER-E, 16 MB flash, PSRAM).
;
;   pio run -e usb -t upload     first flash, or recovery, over the UART port
;   pio run -e ota -t upload     build, hand the image to the hub, and let the
;                                hub push it to CALLIOPE_NODE (id, name or "all")
;
; OTA env: CALLIOPE_URL (default https://orko.gabrielbelli.com:30080),
; CALLIOPE_NODE, and CALLIOPE_API_KEY if the gateway has keys set. The image is
; signed with CALLIOPE_SIGNING_KEY (default ~/.config/calliope/firmware-signing.pem).
;
; keys/firmware-signing.pub.pem is compiled in when it exists, and then the node
; refuses any update that key did not sign (scripts/firmware_key.py).

[env]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    '-DDEFAULT_HUB="wss://orko.gabrielbelli.com:30080"'
lib_deps =
    tzapu/WiFiManager@2.0.17
    links2004/WebSockets@2.6.1
    bblanchon/ArduinoJson@7.4.2
    adafruit/Adafruit NeoPixel@1.15.1
extra_scripts =
    pre:scripts/version.py
    pre:scripts/firmware_key.py
monitor_speed = 115200

[env:usb]
; esptool fails above 230400 baud on this board's CP2102N link.
upload_speed = 230400

[env:ota]
; Replaces the list above rather than adding to it, so it repeats both.
extra_scripts =
    pre:scripts/version.py
    pre:scripts/firmware_key.py
    scripts/upload_via_hub.py
