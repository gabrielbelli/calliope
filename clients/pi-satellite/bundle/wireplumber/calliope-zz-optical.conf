# Installed by the Calliope satellite (clients/pi-satellite, install.sh) into
# wireplumber.conf.d. Named to load after calliope-quality.conf, whose rule
# for every output it overrides here.
#
# A C-Media CM6206 card (StarTech ICUSBAUDIO7D and its kin) mixes its optical
# input into its outputs itself, and its own output volume is the only thing
# that changes how loud that is (calliope_pi/optical.py). PipeWire gets a
# software volume for this card instead, so the satellite's volume and the
# phone's slider move only PipeWire's own audio, and the card's volume is
# left to the agent as the optical input's.
#
# The chip mixes the optical input with no rate conversion, on its own clock,
# so while PipeWire streams to the card the two clocks drift apart and the
# optical audio ticks (measured on pi-edifier, 28 Oct 2026: clean with the
# card's stream stopped, ticking with it running, worse at 96 kHz). The card
# runs at the optical input's 48 kHz, and sleeps 3 s after the satellite's
# own audio stops, so a TV playing alone is clean.
monitor.alsa.rules = [
  {
    matches = [ { device.vendor.id = "0x0d8c", device.product.id = "0x0102" } ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
  {
    matches = [ { node.name = "~alsa_output.usb-0d8c_USB_Sound_Device*" } ]
    actions = {
      update-props = {
        audio.rate                      = 48000
        audio.allowed-rates             = [ 48000 ]
        session.suspend-timeout-seconds = 3
      }
    }
  }
]
