# Installed by the Calliope satellite (clients/pi-satellite, install.sh) into
# wireplumber.conf.d.
#
# Every sound card output (the jack, HDMI, a USB DAC, a DAC HAT) stays awake:
# one that suspends after a few idle seconds clips the first syllable of the
# next reply and can click as it wakes. Converting to what the card takes is
# done at the same high quality as the streams (calliope-quality.conf).
#
# 16-BIT, UNDITHERED. Every source this satellite plays is 16-bit: AirPlay
# (ALAC, 16-bit at 44.1 kHz), the hub's voice and its earcons. The card is
# driven at 16 bits with no dither added, so a 16-bit sample at full volume
# reaches the DAC as it was sent, bit for bit, at the rate it was sent in
# (calliope-quality.conf lets the rate follow). A 24-bit source would be
# cut to 16; there is none today.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.*" } ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
        resample.quality                = 10
        audio.format                    = "S16LE"
        dither.method                   = "none"
        dither.noise                    = 0
      }
    }
  }
]
