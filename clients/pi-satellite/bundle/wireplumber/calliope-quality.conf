# Installed by the Calliope satellite (clients/pi-satellite, install.sh) into
# wireplumber.conf.d.
#
# Every sound card output (the jack, HDMI, a USB DAC, a DAC HAT) stays awake:
# one that suspends after a few idle seconds clips the first syllable of the
# next reply and can click as it wakes. Converting to what the card takes is
# done at the same high quality as the streams (calliope-quality.conf).
#
# THE WIDEST FORMAT THE CARD TAKES (32 or 24 bits on a USB DAC, 16 on the
# Pi's own jack), left to PipeWire. AirPlay's 16-bit samples at full volume
# reach the card unchanged, carried in the wider word; and a reply mixed
# over the music is mixed in float and kept at that width, so the music is
# not rounded to 16 bits while the voice plays. No dither is added.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.*" } ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
        resample.quality                = 10
        dither.method                   = "none"
        dither.noise                    = 0
      }
    }
  }
]
