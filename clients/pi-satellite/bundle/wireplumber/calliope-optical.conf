# Installed by the Calliope satellite (clients/pi-satellite, install.sh) into
# wireplumber.conf.d.
#
# A C-Media CM6206 card (StarTech ICUSBAUDIO7D and its kin) mixes its optical
# input into its outputs itself, and its own output volume is the only thing
# that changes how loud that is (calliope_pi/optical.py). PipeWire gets a
# software volume for this card instead, so the satellite's volume and the
# phone's slider move only PipeWire's own audio, and the card's volume is
# left to the agent as the optical input's.
monitor.alsa.rules = [
  {
    matches = [ { device.vendor.id = "0x0d8c", device.product.id = "0x0102" } ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
]
