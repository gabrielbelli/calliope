# Installed by the Calliope satellite (clients/pi-satellite, install.sh) into
# pipewire.conf.d, client.conf.d and pipewire-pulse.conf.d.
#
# AIRPLAY IS NEVER CONVERTED. The output runs at AirPlay's rate, 44.1 kHz
# (or its multiples, for a source that has them), and nothing else may move
# it: the hub's voice arrives at 44.1 kHz too, and an earcon or any other
# source at 48 kHz is converted to it, at quality 10 of 15 (the default is
# 4), which a Pi 3 does for stereo with CPU to spare. A card that cannot do
# 44.1 kHz at all (some USB dongles) runs at what it can, and everything is
# converted for it. A stereo stream stays stereo: nothing is upmixed.
context.properties = {
    default.clock.rate          = 44100
    default.clock.allowed-rates = [ 44100 88200 176400 ]
}
stream.properties = {
    resample.quality = 10
    channelmix.upmix = false
}
