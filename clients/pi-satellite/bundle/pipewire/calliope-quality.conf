# Installed by the Calliope satellite (clients/pi-satellite, install.sh) into
# pipewire.conf.d, client.conf.d and pipewire-pulse.conf.d.
#
# THE BEST THE HARDWARE TAKES, AND NO RESAMPLING THAT IS NOT NEEDED.
# PipeWire runs its graph at the rate of what plays when the output can do
# it (AirPlay at 44.1 kHz, a 96 kHz file at 96 kHz), rather than converting
# everything to 48 kHz. When two sources at different rates mix (a reply
# over music), the one that must be converted is converted at quality 10 of
# 15 (the default is 4), which a Pi 3 does for stereo with CPU to spare.
# A stereo stream stays stereo: nothing is upmixed.
context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 44100 48000 88200 96000 176400 192000 ]
}
stream.properties = {
    resample.quality = 10
    channelmix.upmix = false
}
