# The wake words to train. Each key under `models` is the model name and its
# file name (<name>.onnx), the name the hub is given.
#
# THESE ARE EXAMPLES: the nine words the measurements in README.md were made
# with. Replace them with your own, or train only yours with --only, or keep
# yours in a file of your own and pass it with --phrases. `train --profile
# full` with neither trains every model below, about 85 minutes each on a
# 4 GB GPU. hey_chat_gpt shows letters spelt out, gemini a second reading,
# and grok and lumos the `pronunciations` a word missing from CMUdict needs.
# alexa_ptbr, the tenth, shows `adversarial_exclude`; it also needs clips that
# train.py does not make (see its comment), so a run of every model trains it
# on its English half only.
#
#   phrases         What the LibriTTS-R generator says (openWakeWord's
#                   target_phrase). Spell it the way espeak-ng should read it:
#                   "g p t" gives three stressed letters, "gpt" one acronym
#                   with the stress on the T. Every word must be in CMUdict
#                   or in `pronunciations` below, because openWakeWord builds
#                   its adversarial phrases from those pronunciations.
#   negatives       Hand-picked confusable phrases, added to the ones
#                   openWakeWord generates (its custom_negative_phrases).
#                   Never a homophone of the wake word: a clip that sounds the
#                   same, labelled negative, teaches the model to reject it.
#                   Each is rendered about once among n_samples negatives, so
#                   one line carries little weight; repeat a phrase in the
#                   list to give it more.
#   eval            How a person writes it. Spoken by held-out voices (macOS
#                   `say`, unused LibriTTS-R speaker blends) for evaluate.py.
#   eval_negatives  Confusable phrases kept OUT of training, for measuring how
#                   often the model accepts a near miss it has never seen.
#   train           Optional overrides of the training profile for this model.
#                   Any key of openWakeWord's config goes here (layer_size,
#                   batch_n_per_class), and adversarial_exclude: regular
#                   expressions for the generated adversarial phrases that must
#                   not become negatives (see oww_train.py).

# ARPAbet for words CMUdict lacks (see oww_train.py for why this matters).
pronunciations:
  grok: G R AA1 K
  gpt: JH IY2 P IY2 T IY1         # espeak reads "gpt" as one acronym, stress on the T
  lumos: L UW1 M OW0 S            # espeak: LOO-mohz
  lumoss: L UW1 M AA2 S           # espeak: LOO-moss, as in the films
  jemminee: JH EH1 M IH0 N IY2    # the JEM-in-ee reading of "gemini"

# Single words are short, so more ordinary speech happens to contain something
# close to them. These models get a wider layer and twice the adversarial
# negatives per batch; the false accepts they still make are reported as-is.
single_word: &single_word
  layer_size: 64
  batch_n_per_class: {ACAV100M_sample: 1024, adversarial_negative: 100, positive: 50}

models:
  hey_claude:
    phrases: [hey claude]
    negatives: [hey cloud, hey clod, hey clause, hey claws, hey claudia, hey claudio, hey clyde,
                hey clown, hey code, hey lord, hey cloudy, hey called, hey clog, hey glad, a cloud]
    eval: [Hey Claude]
    eval_negatives: [hey crowd, hey clock, hey maude, hey applaud, okay cloud]

  hey_gemini:
    phrases: [hey gemini, hey jemminee]
    negatives: [hey germany, hey jimmy, hey gemma, hey jeremy, hey jemima, hey jenny,
                hey lemony, hey harmony, hey jasmine, hey chimney, hey mini, hey genie, hey gem]
    eval: [Hey Gemini]
    eval_negatives: [hey feminine, hey eminem, hey many, hey jamie, hey jenna]

  hey_grok:
    phrases: [hey grok]
    negatives: [hey rock, hey grow, hey crock, hey grog, hey croc, hey frock, hey grab, hey block,
                hey broke, hey rocket, hey clock, hey groan, hey crook, hey truck, hey grope]
    eval: [Hey Grok]
    eval_negatives: [hey gross, hey rook, hey dock, hey brock, hey crop]

  hey_chat_gpt:
    phrases: [hey chat g p t, hey chat gpt]
    negatives: [hey chat g p s, hey chat c p u, hey chat b b c, hey chat t v, hey chatty, hey chad,
                hey jack, hey chat, hey cat, hey g p s, hey chat e p, hey chat d v d]
    eval: [Hey ChatGPT, Hey chat G P T]
    eval_negatives: [hey chat g p u, hey chatbot, hey cheap tea, hey chat is key, hey patty]

  claude:
    phrases: [claude]
    negatives: [cloud, clod, clause, claws, claudia, claudio, clyde, clown, code, cord, called,
                glad, lord, load, crowd, fraud, maude, loud, clog, clot]
    eval: [Claude]
    eval_negatives: [applaud, clock, cloudy, closed, gloat]
    train: *single_word

  gemini:
    phrases: [gemini, jemminee]
    negatives: [germany, jimmy, gemma, jeremy, jemima, jenny, lemony, harmony, jasmine,
                chimney, mini, genie, gem, many, jamie]
    eval: [Gemini]
    eval_negatives: [feminine, eminem, jenna, lemming, seminar]
    train: *single_word

  grok:
    phrases: [grok]
    negatives: [rock, grow, crock, grog, croc, frock, grab, block, broke, groan, crook, truck,
                grope, rook, gross, clock, group, grove]
    eval: [Grok]
    eval_negatives: [dock, brock, grog shop, crop, grass]
    train: *single_word

  gpt:
    phrases: [g p t, gpt]
    negatives: [g p s, g p u, g p a, j p g, c p u, b b c, t v, e t a, d v d, g b, g t, p t, jeep,
                g, p, t, gee, key, cheap tea]
    eval: [GPT, G P T]
    eval_negatives: [g t p, d p t, b p t, chatbot, empty]
    train: *single_word

  lumos:
    phrases: [lumos, lumoss]
    negatives: [lumen, lumens, loomis, moose, lemons, numbers, humus, hummus, you must, luminous,
                loom, lumber, remus, famous, rumours, looms]
    eval: [Lumos]
    eval_negatives: [lummox, lupus, nimbus, cosmos, lima]
    train: *single_word

  # "Alexa" as Brazilians and English speakers say it, which should fire far
  # less on ordinary Portuguese speech (television, videos) than openWakeWord's
  # stock alexa_v0.1. It is a separate model: the stock one is kept as it is.
  # train.py makes only the English half. The Portuguese half is added to the
  # work directory after --generate_clips and before --augment_clips (a
  # directory seeded earlier is only topped up to n_samples, so the
  # Portuguese clips would replace English ones instead of adding to them).
  # That half is 22,748 positives from Piper and Kokoro Portuguese voices,
  # with "Alexa" respelt "Aléksa" because a Portuguese voice reads "Alexa" as
  # a-LÉ-sha. It also has 4,793 negatives: everyday speech, and rhymes with
  # another onset (deixa, a caixa, puxa). Train it only with a script that
  # adds that half; without it the model is English only.
  alexa_ptbr:
    # One English spelling. CMUdict has ALEXA (AH0 L EH1 K S AH0) and espeak-ng
    # en-us reads it the same way (ɐlˈɛksə), so it needs no pronunciation. The
    # Brazilian a-LÉK-sa comes from the Portuguese voices, not from a respelt
    # English phrase, which an American voice would say with its own accent.
    phrases: [alexa]
    # English confusables, never near-homophones. Each shares at most one part
    # of uh-LEK-suh: the uh-LE onset (a letter, a lecture, Allegra, a lot of)
    # or the EK-suh rhyme after another onset (Texas, extra, Rebecca, Jessica).
    # Left out: words that share both (Alex, Alexis, Alexia, Alexandra, Lexus,
    # "a lexa"), the a-LESS-a and a-LEE-sha readings a Brazilian may give the
    # word (Alessa, Alicia), "a necklace" (too near the "anexa" that the
    # Portuguese list leaves out), and the held-out near misses below with
    # their inflections. As for the other models, one line is only one or
    # two clips of 50,000. The generated adversarial phrases and the
    # Portuguese negatives carry the weight.
    negatives: [a letter, a lecture, a legend, allegra, a lot of, texas, a taxi, extra, excellent,
                mexico, nexus, rebecca, jessica, elsa, alpha]
    # As written. The macOS English voices say "Alexa". The held-out
    # Portuguese voices were given "Aléksa", "Alécsa" and "Alékça" instead,
    # for the reason above.
    eval: [Alexa]
    # The near misses of the held-out sets, kept out of every training list
    # (adversarial_exclude below keeps them out of the generated phrases too).
    # English: the nine of the say-en set. Portuguese: the 20 rhymes that the
    # Portuguese training lists leave out, as spoken in the say-ptbr and
    # say-ptbr-robotic sets and by the Piper voice that training leaves out.
    # train.py heldout also has held-out LibriTTS-R voices say every line, so
    # there the Portuguese ones have an American accent: still near misses the
    # model has never heard.
    eval_negatives: [election, relax a, Alaska, collect a, Electra, Melissa, perplexed, a Tesla, electric,
                     a gueixa, a trouxa, rebaixa, a mexerica, o feixe, a peixada, a princesa, a surpresa,
                     a despesa, a empresa, o complexo, o reflexo, a condessa, a sobremesa, confesso,
                     o sucesso, o acesso, o excesso, o processo, a fechadura]
    train:
      # A single word, three syllables: the single-word settings (a 64-wide
      # layer, 100 adversarial negatives per batch), as lumos had when its
      # Portuguese retrain worked. The rest is the full profile: 50,000
      # English positives, so the Portuguese ones are 31% of all positives,
      # close to lumos's third. Upstream sizes the clips from the median test
      # positive plus 0.75 s, and at least 2 s. The Portuguese clips have a
      # median of 0.9 s, so the clips stay 2 s and the model sees 16 frames
      # (1.28 s), as the stock model does.
      <<: *single_word
      # The generated adversarial phrases for "alexa" come from about 12,000
      # CMUdict words, chosen by phoneme overlap. One draw the size of a full
      # run's (40,010 phrases) held near-homophones, 1.5% of it: alexia,
      # alexi, alexei, alexis, oleksy, olexa, alexandre, alessio, dyslexia. A
      # clip that sounds like the wake word, labelled negative, teaches the
      # model to reject the wake word; Portuguese near-homophones among its
      # negatives are why the first Portuguese retrain of lumos failed. The
      # draw also held the English near misses of the evaluation and their
      # inflections (1.2%: election, alaskan, relaxing, perplexed, collected),
      # which must stay unheard. Both go. Matched against the spelling, case
      # ignored. elixir, galaxy, flexible and collection are kept: they differ
      # from uh-LEK-suh in more than one sound.
      adversarial_exclude:
        - '\b[aeo]le(x|ks|kz|cs|ss|sk|sh)'     # alexis, alexia, alexei, alessio, elexis, olexa, oleksy
        - '\b[aeo]l[iy](ci|si|sa|sh)'          # alicia, alysia, elisa: a-LEE-sha
        - '\b(dal[ei]ss|mel[ei]ss|dyslexi)'    # dalessio, melessa, dyslexia
        - '\b(alaska|melissa|perplex|relax|tesla|ele[ck]tra)'           # held-out near misses and
        - '\b(collect(s|ed|ing|ors?)?|elections?|electrics?)\b'         # their inflections
        - '\blenexa'                           # luh-NEK-suh, a Kansas town in CMUdict
