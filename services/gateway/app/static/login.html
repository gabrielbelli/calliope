/* THE APP'S IDENTITY, NOT A SECOND ONE. Tokens, mark, display face,
   wash, recess and controls are copied from services/ui/app/static/ui.html,
   which is where each is explained; change them there first. No style
   attribute anywhere: the CSP allows this block by its hash only. */
:root{
  --panel:#F8F5EE; --bg:#EAE6DD; --sunk:#DFD9CB;
  --line:#C6BEAE; --ink:#1A1714; --dim:#565049;
  --field-line:#837B6D;
  --accent:#33404C; --accent-ink:#F8F5EE;
  --warn:#7A4A0F; --warn-bg:#F6EAD3;
  --bad:#8E2A20; --bad-bg:#F3E3E0;
  --radius-s:7px; --radius-l:14px;
  --control-h:2.375rem;
  --card-line:var(--line);
  --lift:inset 0 1px 1px rgba(0,0,0,.05), inset 0 -1px 0 rgba(255,255,255,.8);
  --t-title:1.0625rem; --t-body:.875rem; --t-label:.75rem; --t-micro:.6875rem;
  --s1:.25rem; --s2:.5rem; --s3:.75rem; --s4:1rem; --s5:1.5rem; --s6:2.5rem;
  --spring:linear(0, .1804, .4553, .6712, .8123, .8967, .9445, .9708, .9848,
    .9922, .996, .998, 1);
  --glow-rgb:196 42 30;
  --bloom-a:.10; --bloom-top:#EFE7DA;
}
@media (prefers-color-scheme:dark){
  :root{
    --panel:#201D18; --bg:#141210; --sunk:#0E0C0A;
    --line:#423D33; --ink:#EBE5DA; --dim:#A69D8E;
    --field-line:#8F8779;
    --accent:#B2BFC9; --accent-ink:#12181D;
    --warn:#EFC178; --warn-bg:#382C13;
    --bad:#F2A79B; --bad-bg:#38201C;
    --card-line:var(--line);
    --lift:inset 0 1px 1px rgba(0,0,0,.35), inset 0 -1px 0 rgba(255,255,255,.05);
    --bloom-a:.20; --bloom-top:#31211B;
  }
}
:root{color-scheme:light dark}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;background:var(--panel);color:var(--ink);
  font:var(--t-body)/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-optical-sizing:auto;
  min-height:100svh;display:flex;flex-direction:column;
  padding:var(--s5) var(--s4)}
/* margin:auto centres the column on both axes and still lets it scroll from
   the top when the viewport is shorter than it is. */
main{position:relative;z-index:1;width:100%;max-width:24rem;margin:auto}

/* The lit room: the same wash as the app, at the app's default tint. */
.bloom{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(42% 24% at 50% 100%, rgb(var(--glow-rgb) / var(--bloom-a)), transparent 72%),
    radial-gradient(90% 44% at 50% 0%, var(--bloom-top), transparent 72%)}

/* ----------------------------------------------------------- masthead -- */
.masthead{display:flex;flex-direction:column;align-items:center}
.mark{display:block;width:64px;height:64px;margin:0 0 var(--s5)}

.word{margin:0;font-family:"Calliope Display",system-ui,-apple-system,sans-serif;
  font-weight:700;font-size:clamp(2.5rem,4vw + 1.5rem,4rem);line-height:.9;
  letter-spacing:-.04em;color:var(--ink);text-align:center;text-wrap:balance}
/* THE HEADING STANDS OFF THE CARD. With no line under it, "Sign in" sat on
   the card's top edge; the same gap a tagline leaves on the other form. */
.word + .card{margin-top:var(--s5)}
.tagline{margin:clamp(.5rem,1.4vh,.9rem) 0 var(--s5);font-size:var(--t-title);
  line-height:1.35;letter-spacing:-.011em;color:var(--dim);text-align:center}

/* --------------------------------------------------------------- card -- */
.card{background:var(--bg);border:1px solid var(--card-line);
  border-radius:var(--radius-l);padding:var(--s5);box-shadow:var(--lift)}
input,button{font:inherit;color:inherit}
label{display:block;font-size:var(--t-label);line-height:1.45;color:var(--dim);
  margin:0 0 var(--s1);letter-spacing:.005em}
input + label{margin-top:var(--s4)}
input{display:block;width:100%;min-height:var(--control-h);margin:0;
  background:var(--sunk);border:1px solid var(--field-line);
  border-radius:var(--radius-s);padding:.4375rem .5625rem}
/* A password manager's fill keeps the slot's own colours, not the engine's
   pale blue. */
input:-webkit-autofill{-webkit-text-fill-color:var(--ink);caret-color:var(--ink);
  box-shadow:inset 0 0 0 100vmax var(--sunk)}
button{display:block;width:100%;min-height:var(--control-h);margin-top:var(--s5);
  border:1px solid transparent;border-radius:var(--radius-s);
  padding:.4375rem .8125rem;cursor:pointer;
  transition:transform .12s var(--spring),border-color .12s ease,opacity .12s ease}
.primary{background:var(--accent);color:var(--accent-ink);
  border-color:transparent;font-weight:600}
button:hover:not(:disabled){border-color:var(--dim)}
button:active:not(:disabled){transform:scale(.975)}
button:disabled,.primary:disabled{cursor:not-allowed;background:var(--sunk);
  color:var(--dim);border-color:var(--line)}
:where(button,input):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rules{margin:var(--s3) 0 0;padding-left:1.1rem;font-size:var(--t-label);
  line-height:1.45;letter-spacing:.005em;color:var(--dim)}
.note{font-size:var(--t-label);line-height:1.45;letter-spacing:.005em;
  border-radius:var(--radius-s);padding:var(--s2) var(--s3);margin-top:var(--s3);
  overflow-wrap:anywhere}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.note.bad{background:var(--bad-bg);color:var(--bad);
  border-left:2px solid var(--bad)}
#locked{margin-top:var(--s4)}

/* ------------------------------------------------------ the reader's own -- */
@media (prefers-reduced-motion:reduce){
  button:active:not(:disabled){transform:none;opacity:.65}
}
@media (prefers-reduced-transparency:reduce){ .bloom{display:none} }
@media (prefers-contrast:more){
  :root{--line:#837B6D;--dim:#3C372F;--card-line:#837B6D}
  .bloom{display:none}
  .primary{border:1px solid var(--ink)}
}
@media (prefers-contrast:more) and (prefers-color-scheme:dark){
  :root{--line:#8F8779;--dim:#DBD5C9;--card-line:#8F8779}
}
@media (forced-colors:active){
  .bloom{display:none}
  .primary{background:ButtonFace;color:ButtonText;border:1px solid ButtonBorder}
}
/* 16px in a field on a touch screen, or iOS zooms the page on focus. */
@media (pointer:coarse){
  :root{--control-h:44px}
  input{font-size:1rem}
}
</style>
</head>
<body>
<div class="bloom" aria-hidden="true"></div>
<main>
  <header class="masthead">
    <!-- The favicon's mark, drawn at size: plate, liquid socket, bead. -->
    <svg class="mark" viewBox="0 0 32 32" width="64" height="64" aria-hidden="true" focusable="false">
      <defs>
        <filter id="bead-glow" filterUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
          <feDropShadow dx="0" dy="0" stdDeviation="1.4" flood-color="#FF4438" flood-opacity=".7"/>
        </filter>
      </defs>
      <rect width="32" height="32" rx="7" fill="#1B1512"/>
      <path d="M6 19.5C10.5 19.5 11.8 24.5 16 24.5C20.2 24.5 21.5 19.5 26 19.5" fill="none"
            stroke="#EBE5DA" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="16" cy="12.5" r="3.8" fill="#FF4438" filter="url(#bead-glow)"/>
    </svg>
  </header>

  <form id="signin" novalidate>
    <h1 class="word">Sign in</h1>
    <div class="card">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" autocapitalize="none"
             spellcheck="false" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password"
             required>
      <button class="primary" id="signin-button" type="submit">Sign in</button>
      <div class="note bad" id="signin-error" role="alert" hidden></div>
    </div>
  </form>

  <form id="change" novalidate hidden>
    <h1 class="word">Choose a new password</h1>
    <p class="tagline">You need a new password before you continue.</p>
    <div class="card">
      <label for="new-password">New password</label>
      <input id="new-password" type="password" autocomplete="new-password" required>
      <label for="confirm-password">New password, again</label>
      <input id="confirm-password" type="password" autocomplete="new-password" required>
      <ul class="rules">
        <li>15 to 128 characters</li>
        <li>not a common password</li>
        <li>not your username</li>
      </ul>
      <button class="primary" id="change-button" type="submit">Save and continue</button>
      <div class="note bad" id="change-error" role="alert" hidden></div>
    </div>
  </form>

  <div class="note warn" id="locked" role="alert" hidden></div>
</main>
<script>
"use strict";
/* Self-contained: no other asset, no inline handler, and every server string
   goes in with textContent. The CSP allows this script by its hash only. */
const $ = (id) => document.getElementById(id);

/* Mirrors the server's rule (D55): a relative path that starts with one "/",
   with no "//", no backslash and no control character. The server checks it
   again before handing it back. */
function safeNext(value) {
  if (!value) return "/ui";
  let decoded = value;
  try { decoded = decodeURIComponent(value); } catch (e) { return "/ui"; }
  for (const text of [value, decoded]) {
    if (!text.startsWith("/") || text.includes("//") || text.includes("\\")
        || /[\u0000-\u001f\u007f]/.test(text)) return "/ui";
  }
  return value;
}
const NEXT = safeNext(new URLSearchParams(location.search).get("next"));

const LOCKED = {
  bootstrap_required: "Set CALLIOPE_ADMIN_PASSWORD and restart the gateway.",
  bootstrap_data_lost: "The user database was lost. Run: docker exec -u 1000:1000 voice-gateway python -m app.admin reset-password admin",
  admin_password_weak: "CALLIOPE_ADMIN_PASSWORD is too weak. Use 15 or more characters that are not a common password, then restart.",
  argon2_selftest: "This image's OpenSSL cannot hash passwords with Argon2id. Use an image with OpenSSL 3.2 or later.",
  removed_variable: "Remove the variable named below from the gateway's configuration and restart.",
  public_origin_required: "Set CALLIOPE_PUBLIC_ORIGIN to Calliope's own https address and restart.",
  dev_insecure_cookie: "CALLIOPE_DEV_INSECURE_COOKIE works only on a loopback address. Remove it and restart.",
  keyring_unreadable: "The secret keyring cannot be read. Fix CALLIOPE_MASTER_KEY_FILE and restart.",
};

function show(id, text) {
  const box = $(id);
  box.textContent = text;
  box.hidden = !text;
}

function showLocked(body) {
  const reason = body && body.reason;
  let text = "Calliope is locked. " + (LOCKED[reason] || "See the gateway's log.");
  if (body && body.variable) text += " (" + body.variable + ")";
  show("locked", text);
}

async function call(path, body) {
  const response = await fetch(path, {
    method: "POST", credentials: "same-origin",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  let payload = {};
  try { payload = await response.json(); } catch (e) { /* 204 or not JSON */ }
  return { response, payload };
}

function message(payload, fallback) {
  return (payload && payload.error && payload.error.message) || fallback;
}

function changeView() {
  $("signin").hidden = true;
  $("change").hidden = false;
  $("new-password").focus();
}

let countdown = null;
function wait(seconds) {
  const button = $("signin-button");
  clearInterval(countdown);
  let left = seconds;
  button.disabled = true;
  const tick = () => {
    show("signin-error", "Too many attempts. Try again in " + left + " s.");
    if (left-- <= 0) {
      clearInterval(countdown);
      button.disabled = false;
      show("signin-error", "");
    }
  };
  tick();
  countdown = setInterval(tick, 1000);
}

$("signin").addEventListener("submit", async (event) => {
  event.preventDefault();
  const button = $("signin-button");
  button.disabled = true;
  show("signin-error", "");
  try {
    const { response, payload } = await call("/auth/login", {
      username: $("username").value, password: $("password").value, next: NEXT,
    });
    $("password").value = "";
    if (response.ok) {
      if (payload.must_change) { changeView(); return; }
      location.assign(safeNext(payload.next));
      return;
    }
    if (response.status === 429) {
      wait(parseInt(response.headers.get("Retry-After") || "1", 10));
      return;
    }
    if (response.status === 503) { showLocked(payload); return; }
    if (response.status === 403) {
      show("signin-error", message(payload, "Reload the page and try again."));
      return;
    }
    show("signin-error", "Incorrect username or password.");
  } catch (e) {
    show("signin-error", "Calliope is not answering. Try again in a moment.");
  } finally {
    if (!countdown) button.disabled = false;
  }
});

$("change").addEventListener("submit", async (event) => {
  event.preventDefault();
  const first = $("new-password").value;
  if (first !== $("confirm-password").value) {
    show("change-error", "The two passwords are not the same.");
    return;
  }
  const button = $("change-button");
  button.disabled = true;
  show("change-error", "");
  try {
    const { response, payload } = await call("/auth/password", {
      new_password: first, next: NEXT,
    });
    if (response.ok) { location.assign(safeNext(payload.next)); return; }
    if (response.status === 401) {
      $("change").hidden = true;
      $("signin").hidden = false;
      show("signin-error", "That took too long. Sign in again.");
      return;
    }
    show("change-error", message(payload, "That password was not accepted."));
  } catch (e) {
    show("change-error", "Calliope is not answering. Try again in a moment.");
  } finally {
    button.disabled = false;
  }
});

(async () => {
  try {
    const response = await fetch("/auth/me", { credentials: "same-origin" });
    if (response.ok) {
      const me = await response.json();
      if (me.must_change) { changeView(); return; }
      location.replace(NEXT);
      return;
    }
    if (response.status === 503) showLocked(await response.json());
  } catch (e) { /* not signed in, or not answering: the form is the answer */ }
  $("username").focus();
})();
</script>
</body>
</html>
