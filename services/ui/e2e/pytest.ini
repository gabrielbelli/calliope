[pytest]
# The browser tests. NOT under services/ui/tests, whose pytest.ini names
# `testpaths = tests`, so `cd services/ui && pytest` and CI never collect this
# directory and never start a browser. Run it by path:
#
#   <venv>/bin/python -m pytest -q services/ui/e2e -p no:cacheprovider   (from the repository root)
#
# Sixty seconds for the test itself. timeout_func_only, because the first
# test's setup includes waiting for the machine-wide browser lock and starting
# the stack, which have bounds of their own (stack.py), and a per-test clock
# that counted them would fail whichever test happened to run first.
# The signal method, because the thread method ends the process with
# os._exit, which skips every finaliser -- and the finalisers are what kill
# the browser.
timeout = 60
timeout_func_only = true
timeout_method = signal
addopts = -p no:cacheprovider
